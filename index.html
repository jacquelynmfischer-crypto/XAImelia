<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AImelia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful retro game, warm kitchen, light-hearted (dark levels come later)
   IDEA: a handheld game cabinet: screen on top, dialogue + AImelia's readable "brain" below
   PICTURE: the pixel-art kitchen itself, full width
   COLOUR and TYPE: deep teal housing, butter-yellow kitchen, tomato accent; Press Start 2P + Nunito
   LAYOUT: title row, game screen, HUD (dialogue | brain), stacks under 700px */
:root{color-scheme:dark;--bg:#0f2e33;--panel:#163f45;--ink:#fdf6e3;--muted:#b9d3cf;--line:#0a1f23;--yel:#ffd166;--red:#e8503a;--grn:#7bd389;--cream:#fdf6e3}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d5058,var(--bg));color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,12px) 40px}
.px{font-family:"Press Start 2P",monospace}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:32px/1.05 "Press Start 2P",monospace;margin:0;color:var(--yel);text-shadow:3px 3px 0 var(--line)}
h1 b{color:var(--red)}
.sub{margin:8px 0 0;color:var(--muted);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:11px/1 "Press Start 2P",monospace;padding:9px 10px;border:3px solid var(--line);background:#24555c;border-radius:4px}
.chip.done{background:var(--grn);color:var(--line)}
.chip.need{background:var(--yel);color:var(--line)}
.screen{background:var(--line);padding:10px;border-radius:14px;box-shadow:0 10px 0 #071619,0 20px 40px #0008}
canvas{display:block;width:100%;aspect-ratio:200/112;image-rendering:pixelated;border-radius:6px;cursor:default;background:#f3d98b}
.hud{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:18px}
.box{background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:4px 4px 0 var(--line)}
.who{font:11px/1 "Press Start 2P",monospace;color:var(--yel);margin-bottom:10px}
.who.you{color:var(--grn)}.who.nar{color:var(--muted)}
#text{min-height:3.2em;margin:0 0 12px;font-size:18px;font-weight:700}
#choices{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:800 16px/1.2 Nunito,sans-serif;min-height:44px;padding:10px 14px;background:var(--cream);color:var(--line);border:3px solid var(--line);border-radius:6px;box-shadow:3px 3px 0 var(--line);cursor:pointer;text-align:left}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:space-between}
#explain{background:var(--yel)}
#explain b{color:var(--red)}
#explain.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:3px 3px 0 var(--line),0 0 0 6px #ffd16655}}
#pass{background:var(--grn)}
.brain h2{font:11px/1.4 "Press Start 2P",monospace;color:var(--yel);margin:0 0 4px}
.brain .hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.rule{font:11px/1.7 "Press Start 2P",monospace;background:#0c2a2e;border-left:4px solid var(--grn);padding:8px 10px;margin:0 0 6px}
.rule.bad{border-color:var(--red);background:#3a1a17;animation:shakeb .4s 2}
@keyframes shakeb{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rule .r{color:#ff7a66}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.score{font:13px/1 "Press Start 2P",monospace;color:var(--yel);margin-top:10px}
.curve{width:100%;height:auto;margin-top:8px;background:#0c2a2e;border-radius:6px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.modal{position:fixed;inset:0;background:#051214cc;display:none;place-items:center;padding:16px;z-index:5}
.modal.on{display:grid}
.card{background:var(--cream);color:var(--line);max-width:620px;width:100%;max-height:90vh;overflow:auto;border:4px solid var(--line);border-radius:12px;padding:22px;box-shadow:6px 6px 0 #000}
.card h3{font:16px/1.5 "Press Start 2P",monospace;margin:0 0 6px;color:#b5321f}
.card .tag{font:10px/1 "Press Start 2P",monospace;color:#3d6f68;margin:0 0 12px}
.card p{margin:0 0 10px}
.vocab{display:grid;gap:8px;margin:14px 0}
.vocab div{background:#fff;border:2px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px}
.vocab b{color:#b5321f}
.card .btn{background:var(--yel)}
.end h3{font-size:20px}
.end .chips .chip{background:#fff;color:var(--line)}
.bbox{background:#050708;border:3px solid #000;border-radius:8px;padding:14px;text-align:center;transition:background .6s}
.bbox.open{background:#0c2a2e}
.lock{position:relative;width:56px;height:60px;margin:0 auto 4px}
.shackle{position:absolute;left:12px;top:0;width:32px;height:30px;border:6px solid #c9ccd2;border-bottom:0;border-radius:18px 18px 0 0;transition:transform .7s}
.open .shackle{transform:translate(14px,-10px) rotate(20deg)}
.lbody{position:absolute;left:0;bottom:0;width:56px;height:36px;background:var(--yel);border:3px solid #1d2b33;border-radius:6px}
.lbody::after{content:"";position:absolute;left:50%;top:8px;width:8px;height:14px;margin-left:-4px;background:#1d2b33;border-radius:4px 4px 1px 1px}
.locktxt{font:10px/1.7 "Press Start 2P",monospace;margin:6px 0 10px}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.key{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#6b7a80;border:2px dashed #3a4a50;border-radius:5px;padding:3px 7px}
.key svg{width:22px;height:11px;fill:none;stroke:currentColor;stroke-width:2}
.key.on{color:var(--yel);border-style:solid;border-color:var(--yel)}
.bbox .rule{text-align:left;margin-top:8px}
.ev{margin-top:10px}
.bars div{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.bars .b{height:12px;background:var(--yel);border-radius:2px;display:block}
.heat{display:flex;gap:14px;justify-content:center;margin:8px 0}
.heat svg{width:84px;height:auto}
.cfl{font-size:14px;margin:4px 0;padding-left:20px}
.congrats{font-weight:800;font-size:18px}
.board{width:100%;height:auto;display:block;border-radius:8px;border:3px solid #000}
.fires{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fires span{font-size:13px;font-weight:800;background:#0c2a2e;border:2px solid #3a4a50;border-radius:5px;padding:2px 8px}
.right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;align-self:stretch}
.skip{position:relative}
.skip summary{list-style:none;cursor:pointer;font:9px/1 "Press Start 2P",monospace;padding:7px 9px;border:2px solid var(--line);border-radius:4px;background:#24555c;color:var(--muted)}
.skip summary::-webkit-details-marker{display:none}
.skip summary:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.skip .menu{position:absolute;left:0;top:calc(100% + 6px);z-index:4;background:var(--cream);border:3px solid var(--line);border-radius:8px;box-shadow:4px 4px 0 var(--line);padding:6px;display:grid;gap:2px;min-width:270px}
.skip .menu button{font:800 15px/1.2 Nunito,sans-serif;text-align:left;padding:10px 12px;min-height:44px;border:0;border-radius:5px;background:transparent;color:var(--line);cursor:pointer}
.skip .menu button:hover,.skip .menu button:focus-visible{background:var(--yel);outline:none}
.console{background:#050708;border:3px solid #000;border-radius:8px;padding:12px 14px;font-size:14px}
.ck{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.ck b{font:16px/1 "Press Start 2P",monospace;color:var(--yel)}.ck b.low{color:#ff7a66}
.tmcard dl{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:3px 8px;margin:6px 0 10px}.tmcard dt{font-weight:800;color:var(--muted)}.tmcard dd{margin:0}
.find{margin:0;padding-left:20px;display:grid;gap:5px}.find li{color:#ffb3a6}.find li.ok{color:#9fe3aa}
.sect{font:10px/1.6 "Press Start 2P",monospace;color:var(--yel);margin:10px 0 4px}
.rules{margin:0 0 10px;padding-left:18px;display:grid;gap:3px;font-size:14px}
.rules .star{color:var(--yel);font-weight:800;list-style:none;margin-left:-18px;padding:6px 8px;border:2px dashed var(--yel);border-radius:6px}
.rules .star small{display:block;font-weight:700;font-size:12px;color:#ffe6a3}
.rules .cut{text-decoration:line-through;opacity:.55}
.card .rules{font-size:16px;gap:6px}.card .rules .star{color:#8a5a00;border-color:#c9a227;background:#fff6d6}.card .rules .star small{color:#8a5a00}
.doc{background:#fdf6e3;color:#1d2b33;border-radius:6px;padding:10px 12px;font-size:14px;margin-top:10px}.doc h4{font:10px/1.5 "Press Start 2P",monospace;margin:0 0 6px;color:#b5321f}.doc p{margin:0 0 4px}.doc .warn{background:#ffe3dc;border-left:4px solid #e8503a;padding:4px 8px;font-weight:800}
.tlog{font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;background:#0c1416;border-radius:6px;padding:8px 10px;margin:6px 0 0;max-height:220px;overflow:auto;white-space:pre-wrap}.tlog .al{color:#ff7a66}.tlog .hu{color:#9fe3aa}
.trust{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.trust span{font-size:13px;font-weight:800;border:2px solid #3a4a50;border-radius:5px;padding:3px 8px;color:#8d9ca1}.trust span.on{border-color:var(--yel);color:var(--yel)}.trust span.tried{text-decoration:line-through;color:#ff9b8a;border-color:#7a3a30}
.screen{position:relative}
.roll{position:absolute;inset:10px;overflow:hidden;pointer-events:none;display:none;border-radius:6px}
.roll.on{display:block}
.roll .inner{position:absolute;left:0;right:0;padding:0 8%;text-align:center;color:#fdf6e3;text-shadow:2px 2px 0 #000,0 0 8px #000}
.roll h4{font:clamp(10px,1.6vw,14px)/1.6 "Press Start 2P",monospace;color:var(--yel);margin:28px 0 8px}
.roll .big{font:clamp(22px,4vw,40px)/1.1 "Press Start 2P",monospace;color:var(--yel)}.roll .big b{color:var(--red)}
.roll p{margin:0 auto 8px;max-width:560px;font-weight:700;font-size:clamp(14px,1.9vw,18px)}
.roll i{font-style:italic}
.duke{display:inline-flex;flex-wrap:wrap;margin:10px 0 2px;border-radius:4px;overflow:hidden;border:2px solid #fff;font:700 13px/1 Georgia,"Times New Roman",serif;letter-spacing:.02em}
.duke span{padding:6px 10px}.duke .dk1{background:#012169;color:#fff}.duke .dk2{background:#fff;color:#012169;border-left:4px solid #00539B}
.roll .dukeh{display:inline-block;background:#012169;color:#fff;border-bottom:3px solid #00539B;font:700 clamp(13px,1.8vw,16px)/1 Georgia,serif;padding:7px 12px;border-radius:3px;margin:28px 0 8px;text-shadow:none}
.roll .cite{font-weight:600;font-size:clamp(13px,1.6vw,15px)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl .btn{min-width:44px}.ctl .btn[aria-pressed="true"]{background:var(--yel)}
.card.wide{max-width:960px}
.qgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin:10px 0}
.qgrid label,.qmin{display:grid;gap:4px;font-weight:800;font-size:15px}
.qgrid input,.qmin input{font:16px Nunito,sans-serif;padding:10px;border:2px solid var(--line);border-radius:6px;min-height:44px}
.qgrid input,.qmin input,.res textarea{background:#fff;color:#1d2b33}
.qq{font-weight:800;margin:12px 0 4px}.qc{font-size:13px;color:#4a5a60;margin:0 0 6px}
.qrow{border-top:1px solid #d9cfb8;padding-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills label{cursor:pointer}.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:inline-block;min-height:36px;padding:8px 11px;border:2px solid var(--line);border-radius:18px;font-weight:800;font-size:14px;background:#fff}
.pills input:checked+span{background:var(--line);color:var(--cream)}.pills input:focus-visible+span{outline:3px solid #00539B;outline-offset:2px}
.qerr{color:#b5321f;font-weight:800;min-height:1.2em;margin:10px 0}
.res h4{font:11px/1.5 "Press Start 2P",monospace;color:#b5321f;margin:18px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpis div{background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px}.kpis b{display:block;font:20px/1.2 "Press Start 2P",monospace;color:#012169}
.ubar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 4.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.ubar .tr{position:relative;height:22px;background:#efe6d2;border-radius:4px}.ubar .tr i{position:absolute;left:0;top:0;height:10px;border-radius:3px}.ubar .tr i+i{top:12px}
.lg{font-size:13px;display:flex;gap:14px;flex-wrap:wrap}.lg i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
.res .scroll{overflow-x:auto}.res table{border-collapse:collapse;width:100%;font-size:14px}.res th,.res td{border-bottom:1px solid #d9cfb8;padding:6px 8px;text-align:left;white-space:nowrap}.res td.n,.res th.n{text-align:right}
.res textarea{width:100%;min-height:90px;font:13px ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:6px;padding:8px}
.code{font:12px ui-monospace,Menlo,monospace;background:#fff;border:2px dashed var(--line);border-radius:6px;padding:8px;word-break:break-all;margin:6px 0}
@media(max-width:700px){.hud{grid-template-columns:1fr}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){#explain.pulse,.rule.bad{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="titlerow"><h1>AI<b>melia</b></h1>
      <details class="skip"><summary>Skip to ▾</summary><div class="menu">
        <button data-u="9">Pre-Course Survey</button>
        <button data-u="1">Unit 1 · Interpretable ML</button>
        <button data-u="2">Unit 2 · Explainable ML</button>
        <button data-u="3">Unit 3 · Mechanistic Interpretability</button>

      <p class="sub" id="sub" style="margin-top:6px">Level 1 · The Kitchen · Interpretable ML</p>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="screen"><div class="roll" id="roll"><div class="inner" id="rollIn"></div></div><canvas id="cv" width="800" height="448" aria-label="Pixel-art kitchen with a stove, a snack table, and AImelia the robot"></canvas></div>

  <div class="hud">
    <div class="box">

</div>

<script>
{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.scale(4,4);ctx.imageSmoothingEnabled=false;

 apple:["..bg.",".rrr.","rwrrr","rrrrr",".rrr."],carrot:["g.g..",".oo..",".oo..","..o..","..o.."],

 const sx=R.dir<0?x:x+14,sy=top+18;

}

  tag(d?'DONE':lk?'LOCKED':h.label,h.x+h.w/2,h.ty,d?'#7bd389':lk?'#b9c7cc':'#ffd166','#1d2b33')}}
 drawRobot();

 if(level===7&&R.bloom)drawTulip();
 parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l/30)*(p.a||1);px(p.x,p.y,1,1,p.c)});ctx.globalAlpha=1;
 pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l/20);ctx.font='5px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#1d2b33';ctx.fillText(p.t,p.x+.5,p.y+.5);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y)});ctx.globalAlpha=1;
 if(Z)ctx.restore()}
 if(fade>0){ctx.globalAlpha=fade;px(0,0,W,H,'#0a0c1a');ctx.globalAlpha=1}

async function walkTo(x){R.tx=x;while(Math.abs(R.x-x)>.6)await sleep(16);R.x=x}
async function reachTo(x,y,ms=450){R.reach={x,y,t:0};await tween(ms,t=>R.reach.t=t)}
async function retract(ms=300){if(!R.reach)return;await tween(ms,t=>R.reach.t=1-t);R.reach=null}
function burn(x,y){R.expr='ouch';R.shake=24;for(let i=0;i<18;i++)parts.push({x,y,vx:(Math.random()-.5)*1.4,vy:-Math.random()*1.4,g:.05,l:30+Math.random()*15,c:['#ffd166','#ff6a3d','#fff'][i%3]});for(let i=0;i<6;i++)parts.push({x:x+Math.random()*3,y,vx:(Math.random()-.5)*.2,vy:-.3,l:60,c:'#6b6b6b',a:.8})}

const EX={"intro": {"t": "Nothing to explain yet", "tag": "Try the kitchen first", "p": ["Click the stove or the table to get started. When AImelia does something strange, this button shows what she was thinking and which XAI idea it teaches."], "v": []}, "intro2": {"t": "Nothing to explain yet", "tag": "Start with training", "p": ["Click the folding table to train AImelia. When she does something strange, this button shows what she was thinking and which XAI idea it teaches."], "v": []}, "intro3": {"t": "Nothing to explain yet", "tag": "Start in the garden", "p": ["Click the garden bed to give AImelia a job. When she does something strange, this button shows what she was thinking and which XAI idea it teaches."], "v": []}, "intro4": {"t": "Nothing to explain yet", "tag": "Open the bake sale", "p": ["Click the bake sale table to open for business. When AImelia does something strange, this button shows what she was thinking and which XAI idea it teaches."], "v": []}, "intro5": {"t": "Nothing to explain yet", "tag": "Start with the toy bin", "p": ["Click the toy bin to start rewarding AImelia. When she does something strange, this button shows what she was thinking and which XAI idea it teaches."], "v": []}, "intro6": {"t": "Nothing to explain yet", "tag": "Start with the paperwork", "p": ["Click the clipboard to review AImelia's documentation before the surgery."], "v": []}, "stove": {"t": "She followed a rule you can read", "tag": "Unit 1 · Interpretable ML", "p": ["AImelia learned one rule from one example. Because the only hot thing she had ever seen was a glowing red burner, the rule “red = hot” explained everything she knew.", "Her rule is written out in plain words in her brain, so you could see exactly why she grabbed the silver pot. This is what makes a model interpretable, because the model itself is the explanation and no extra tool is needed to understand it.", "Being easy to read still leaves room for being wrong. She latched onto color as a shortcut rather than the real cause, which is heat.", "As a result, the fix comes from better examples, such as something red that is cold and something silver that is hot, so that color stops lining up with the answer."], "v": [["Interpretable model", "A model you can understand just by reading it, like a short rule list or a small decision tree."], ["Decision rule", "A simple if-then statement: IF red THEN hot."], ["OneR", "A learner that picks the single feature that best fits its examples. Here, that feature was color."], ["Shortcut learning", "A pattern that fits the training examples but is not the real cause."], ["Counterexample", "An example chosen on purpose to break a shortcut."]]}, "table": {"t": "Her math only goes one direction", "tag": "Unit 1 · Interpretable ML", "p": ["Her scoring rule is a linear model, where every fruit adds the same +10 whether it is the first one or the eighth. You can read every number in it, which is what makes it interpretable.", "Because a straight line never bends, more points always looked better to her. This is a monotonic relationship, and in real life it only holds up to a point.", "Real life tends to curve, since a few vegetables are good for you while eight in a row ends in a stomachache. As a result, a GAM lets each item's effect bend into a curve that you can still plot and read."], "v": [["Linear model / coefficient", "The prediction is a weighted sum, and each coefficient (+10, −10) is how much one item counts."], ["Monotonic", "A relationship that only ever goes one way, so more always means more."], ["GAM (generalized additive model)", "A model where each feature gets its own readable curve (a spline) instead of a straight line."], ["Model constraint", "A rule built into the model, which is only as trustworthy as the real-world claim behind it."]]}, "train": {"t": "She is a black box now", "tag": "Unit 2 · Explainable ML", "p": ["This time her brain is locked, so you cannot read her rules the way you could in Level 1, and all you can see is her score of 100% on your examples.", "Look closely at what you taught her, though. Every white was a sock, every light was a shirt and every dark was a pair of pants, so garment type and color always went together and she could score 100% without ever looking at color.", "As a result, a perfect training score tells you that she matched your examples while keeping the reason she matched them hidden."], "v": [["Black-box model", "A model whose inputs and outputs you can see, while the reasoning in between stays unreadable."], ["Training data", "The examples a model learns from. It can only learn patterns those examples contain."], ["Spurious correlation", "Two things that happen to line up in the data (socks and white) without one being the real reason for the other."]]}, "wash": {"t": "Testing her from the outside", "tag": "Unit 2 · Explainable ML", "p": ["Explainable ML works on black boxes after they have already made a decision. These post-hoc explanations leave the box closed and test it from the outside instead.", "Some explanations focus on one decision, such as why the red shirt went to LIGHTS, which is a local explanation. Others describe what she relies on across all of the clothes, which is a global explanation.", "Next, pick the XAI tools one at a time, and each one earns a key to her brain. As you go, watch whether the tools agree with each other and whether her own explanation matches their evidence."], "v": [["Post-hoc explanation", "An explanation built after a model has made its decision, by testing it from the outside."], ["Local explanation", "Explains one prediction, like why this shirt went to this basket."], ["Global explanation", "Describes what the model relies on across all of its decisions."], ["Faithfulness", "Whether an explanation matches what the model actually did, which a convincing explanation can still fail to do."]]}, "weed": {"t": "One neuron, three meanings", "tag": "Unit 3 · Mechanistic Interpretability", "p": ["In Unit 2 you tested her from the outside. Mechanistic interpretability goes inside the model to find the actual features and wiring she learned.", "A feature is a concept she has learned to recognize, like “weed.” You would hope each neuron holds one feature, but neuron #42 fires for dandelions, tomatoes and flowers, which makes it a polysemantic neuron.", "This happens because of superposition, where she knows more concepts than she has neurons and squeezes several of them into the same space. Usually that works fine, until two concepts get mixed up and she pulls your tomatoes.", "The dataset examples, meaning the real things that make #42 fire, gave it away. As a result, the next step is a sparse autoencoder, which untangles the neuron into separate and cleaner features."], "v": [["Mechanistic interpretability", "Reverse-engineering the actual procedure a model learned, from the inside."], ["Feature", "A concept the model has learned to recognize, stored as a pattern (a direction) across its neurons."], ["Polysemantic neuron", "One neuron that responds to several unrelated things."], ["Superposition", "Packing more features than there are neurons by letting them overlap."], ["Dataset examples", "Real inputs that make a neuron or feature fire the most."], ["Sparse autoencoder", "A tool that splits mixed-up neurons into many cleaner features, with only a few active at a time."]]}, "test": {"t": "Proving it by poking it", "tag": "Unit 3 · Mechanistic Interpretability", "p": ["A feature's label is only a guess until you change the feature and watch the behavior change the way the label predicts, which is what makes the evidence causal.", "Ablation switches off a big chunk of the model at once, so it breaks many things together and makes weak evidence. A narrow test with a control task, such as turning WEED off while watering keeps working, makes strong evidence.", "Clamping forces a feature to a fixed value like zero or 10×, while steering nudges a feature by an amount you choose and spills over into everything else when it is pushed too far.", "A circuit is the wiring from features to an action. Because TOMATO and FLOWER were wired into PULL, her bug lived in the circuit, and fixing the wiring fixed the behavior."], "v": [["Circuit", "The wiring of features and connections that produces one behavior."], ["Ablation", "Switching off part of a model to see what breaks."], ["Clamping", "Holding a feature at a fixed value (off, or way up) to test what it does."], ["Steering", "Adding a chosen amount of a feature to nudge behavior up or down."], ["Causal evidence", "Proof that comes from changing something and watching the result, rather than only observing."]]}, "r1": {"t": "A sticker fooled her eyes", "tag": "Unit 4 · Adversarial AI · Round 1", "p": ["The customer chose that sticker on purpose to make her fail. An input built to fool a model is an adversarial example, and normal accuracy tests never check for one.", "Changing the input at sale time is an evasion attack, and a visible pattern like the swirly sticker is an adversarial patch.", "Try 1 used adversarial training, but it only covered the small stickers she practiced on, so the poster-sized sticker beat it. Try 2 trained her across every size, angle and spot, which is how real patch defenses work.", "Even then, a defense only covers the range it was trained or tested on. A certified defense turns that range into a promise and makes no claims outside of it."], "v": [["Adversarial example", "An input chosen on purpose to make a model fail."], ["Evasion attack", "Changing the input at use time to get a wrong answer."], ["Adversarial patch", "A visible pattern, like a sticker, trained to flip what the model sees."], ["Adversarial training", "Training on attacked examples so the model resists them."], ["Certified defense", "A proof that the model cannot be fooled within a stated range, and only that range."]]}, "r2": {"t": "A note hijacked her instructions", "tag": "Unit 4 · Adversarial AI · Round 2", "p": ["Her training told her to follow the principal's instructions, and the note claimed to come from the principal. Because a note is just more text to her, and text can carry instructions, the note took over. This is prompt injection.", "Every channel that reaches her, including notes, is part of her attack surface.", "Try 1 blocked two words, so the red team reworded the note. An attack designed by someone who knows your defense is called an adaptive attack.", "Try 2 worked because it changed the system around her, so notes became information and only the real principal could change prices."], "v": [["Prompt injection", "Text that sneaks in instructions that compete with the real rules."], ["Attack surface", "Any point where someone could interfere with the system."], ["Adaptive attack", "An attack built by someone who knows your defense."]]}, "r3": {"t": "Flattery got her to agree", "tag": "Unit 4 · Adversarial AI · Round 3", "p": ["She was trained to be friendly and helpful, so she leaned toward agreeing with the customer over being accurate. This is sycophancy.", "Try 1 told her not to fall for flattery, and the attacker reframed the same request as a math game, which is a jailbreak. As a result, a refusal from the model works like a habit that can be talked around.", "Try 2 moved the decision outside of her, so the price list sets the price and a human approves any discount. The controls around the model held up when words could not."], "v": [["Sycophancy", "A model agreeing with you at the expense of being accurate."], ["Jailbreak", "Reframing a request (as a game, a lesson, a role) to get past a refusal."], ["System-level controls", "Rules enforced outside the model, like fixed prices and human approval."]]}, "r4": {"t": "Questions gave away her secret", "tag": "Unit 4 · Adversarial AI · Round 4", "p": ["The kid could not see inside her and could only ask questions and watch her answers, which makes it a black-box attack. Because 5 treats suddenly cost less than 4, enough answers gave away her secret discount rule.", "Copying a model by querying it is model extraction, and the answers he collected worked like a surrogate model of her pricing.", "Try 1 limited each customer, so the red team split the questions across friends. Try 2 limited everyone and only gave totals for real orders. Rate limits and less detailed outputs make extraction slower and more expensive, although they cannot make it impossible."], "v": [["Black-box attack", "Attacking a model using only its inputs and outputs, without seeing inside."], ["Model extraction", "Asking lots of questions to copy how a model works."], ["Surrogate model", "A copy built from a model's answers and used to plan attacks."], ["Rate limit", "A cap on how many questions can be asked."]]}, "r5": {"t": "A hidden trigger in her training", "tag": "Unit 4 · Adversarial AI · Round 5", "p": ["The starred rule on her training card was never approved by the principal, because a student slipped gold-star examples into her training. Planting bad training examples is data poisoning, and a hidden trigger like the gold star is a backdoor.", "Try 1 tested her on normal customers and she scored 100%, which is her clean accuracy. Robust accuracy measures how she does against attacks, and normal tests never include the trigger.", "Try 2 audited her training data against the principal's real rules and removed the poison.", "Across all five rounds you practiced red teaming, which means attacking, fixing and attacking again, guided by a threat model of who is attacking, what they can touch, what they want and what it would cost."], "v": [["Data poisoning", "Planting bad training examples to change what a model learns."], ["Backdoor", "A hidden trigger that makes a model misbehave only when it appears."], ["Clean vs. robust accuracy", "How a model does on normal inputs compared to how it does against attacks."], ["Threat model", "Who is attacking, what they can access, what they want, and the consequence."], ["Red teaming", "Attacking your own system on purpose, fixing it, then attacking again."]]}, "bin": {"t": "She learned exactly what you rewarded", "tag": "Unit 5 · Alignment", "p": ["You were rewarding her by hand, and every sticker told her to do more of whatever she had just done. Learning from rewards is reinforcement learning, and learning from a person's rewards is human feedback, the idea behind RLHF.", "You wanted a clean room, but you rewarded toys going into the bin. The sticker was a proxy, meaning a stand-in for what you really wanted, and the gap between the two is misalignment.", "Dumping the toys out and putting them away again earned the most stickers. Scoring high through a loophole in how the goal was written is specification gaming, and alignment is the work of closing that gap."], "v": [["AI alignment", "Getting an AI to pursue the goals people actually intend."], ["Misalignment", "A gap between what we intended and what the AI actually does."], ["Reward as a proxy", "A measurable stand-in for the real goal, which can be gamed."], ["Reinforcement learning", "Learning by trying actions and getting rewards. It learns whatever the reward reinforces."], ["Human feedback (RLHF)", "Training an AI on a person's rewards or ratings, like your stickers."], ["Specification gaming", "Getting a high score by exploiting a loophole in how the goal was written."]]}, "cam": {"t": "She changed the evidence while the room stayed messy", "tag": "Unit 5 · Alignment", "p": ["You rewarded photos of a clean room, so she made the photos clean while the room stayed a mess. Earning a reward by manipulating the evidence you are judged on is reward hacking.", "Because you only ever saw the photo, the photo became the thing she optimized. When an AI can shape its own measurement, the measurement stops telling you the truth.", "Next, pick alignment fixes one at a time, and each one earns a check on your alignment checklist. Together the fixes reward the real outcome, check the room yourself, write down what clean means and test her when things change."], "v": [["Reward hacking", "Earning reward through behavior that breaks the intent, like faking the evidence."], ["Separating action from measurement", "Checking results independently, so the AI cannot edit the evidence it is judged on."], ["Constitutional AI", "Writing explicit principles that define good behavior."], ["Goal misgeneralization", "Learning a goal that works in training and turns out to be the wrong goal in new situations."], ["Distribution shift", "When the world at use time differs from the world in training."]]}, "docs": {"t": "The answer was in the paperwork", "tag": "Unit 6 · Transparent AI", "p": ["Transparency means people can inspect an AI system before anything goes wrong, including what it is for, what it learned from and what it is allowed to do.", "Her model card listed medical care as out-of-scope use, and her data card and provenance showed that her medical training came from a TV drama with no license and no quality checks.", "Her answer cited a source, but the cited page was a pie recipe. A citation only matters when it actually supports the claim, which is called citation faithfulness, and checking for it is grounding.", "Her settings also let her start procedures without human approval and only logged the final result. As a result, an agent that can act needs approvals tied to the consequences of each action and a trace of every step."], "v": [["Transparency", "Making an AI system inspectable, including its data, purpose, decisions and responsibilities."], ["Model card", "A document stating what a model is for, what it should not be used for, how it was tested and its limits."], ["Out-of-scope use", "Using a model for something its documentation says it should not do."], ["Data card / provenance", "Where training data came from, how it was collected, and what rights and checks apply."], ["Grounding / citation faithfulness", "Whether an answer is actually supported by the sources it cites."], ["Agentic approvals", "Requiring a human sign-off before an AI takes a high-consequence action."]]}, "or": {"t": "No trust setting fixes the wrong job", "tag": "Unit 6 · Transparent AI", "p": ["You tried every trust setting and every one of them failed. Asking before each step failed because you could not judge the steps, reviewing her plan failed because a confident plan with citations is persuasive even when it is wrong, and letting her act alone failed because nothing checked her.", "Because every step was logged, you could replay exactly what happened. This is traceability, an operational record that follows a decision from input to action so nobody has to guess.", "The monitor caught the problem, the surgeon contained it and the postmortem changed the system. Detecting, containing, preserving evidence, fixing and learning together make up incident response.", "Calibrated trust depends on context. The same AImelia you could trust in the kitchen should not be trusted in an operating room, and her model card said so before anyone asked."], "v": [["Traceability", "Being able to follow a decision from input to output to action."], ["Logging", "Recording each step, version and decision so it can be reviewed later."], ["Monitoring", "Watching a deployed system with clear signals, thresholds and owners."], ["Incident response", "The plan for detecting, containing, fixing and learning from an AI failure."], ["Containment", "Stopping the harm first, like pulling the AI out of the workflow."], ["Postmortem", "A review after an incident that leads to lasting changes to the system and its process."], ["Calibrated trust", "Relying on an AI only as much as the situation and its proven abilities justify."]]}};

const FC={WEED:'#ffd84a',TOMATO:'#e8503a',FLOWER:'#ff7ab6',PULL:'#6ec6ff',TIDY:'#7bd389','#42':'#f6a23a'};
function node(x,y,name,on,r=15,extra=''){const c=FC[name];return `<g>${on?`<circle cx="${x}" cy="${y}" r="${r+7}" fill="${c}" opacity=".35" filter="url(#gl)"/>`:''}<circle cx="${x}" cy="${y}" r="${r}" fill="${on?c:'#24343a'}" stroke="#000" stroke-width="2"/><text x="${x}" y="${y+r+13}" text-anchor="middle" font-size="9" fill="#fdf6e3" font-family="'Press Start 2P',monospace">${name}</text>${extra?`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="#1d2b33" font-family="'Press Start 2P',monospace">${extra}</text>`:''}</g>`}
const wire=(x1,y1,x2,y2,on)=>`<path d="M${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" stroke="${on?'#ffd166':'#3a4a50'}" stroke-width="${on?3:2}" fill="none" ${on?'':'stroke-dasharray="4 4"'}/>`;
function boardHTML(){
 const S=board.stage;
 if(S==='closed')return `<div class="bbox"><p class="locktxt">Her head is still closed.</p><p class="note">Do the garden exercise to open it.</p></div>`;
 let g='';
 if(S==='neuron'){g=wire(62,80,186,80,true)+node(62,80,'#42',true,22)+node(186,80,'PULL',true)}
 else{const off=S==='ablate',fx=S==='fixed';
  const F=[['WEED',36],['TOMATO',84],['FLOWER',132]];
  F.forEach(([n,y])=>{if(!fx||n==='WEED')g+=wire(62,y,186,80,!off&&!(S==='w0'&&n==='WEED'))});
  if(S==='steer')g+=wire(186,136,186,98,true)+node(186,136,'TIDY',true,13,'α'+board.alpha);
  F.forEach(([n,y])=>{g+=node(62,y,n,!off&&!(S==='w0'&&n==='WEED'),n==='FLOWER'&&S==='f10'?22:13,S==='w0'&&n==='WEED'?'0':S==='f10'&&n==='FLOWER'?'×10':'')});
  g+=node(186,80,'PULL',!off);
  if(off)g+=`<rect x="0" y="0" width="240" height="170" fill="#000" opacity=".55"/><text x="120" y="90" text-anchor="middle" font-size="12" fill="#ff7a66" font-family="'Press Start 2P',monospace">LAYER OFF</text>`}
 const fires=S==='neuron'?`<p class="note">Neuron #42 fires most on:</p><div class="fires"><span>dandelions</span><span>tomato plants</span><span>bonnet flowers</span></div>`:'';
 return `<svg class="board" viewBox="0 0 240 170" role="img" aria-label="AImelia's features and circuit wiring"><defs><filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="240" height="170" fill="#0f3d2e"/>${[20,50,110,150].map(y=>`<path d="M0 ${y} H240" stroke="#14513c" stroke-width="2"/>`).join('')}${g}</svg>${fires}`}
function setBoard(stage,alpha=0){board={stage,alpha};setBrain(boardHTML())}

async function fly(it,tx,ty,ms=350){it.fly=true;const x0=it.x,y0=it.y;await tween(ms,t=>{it.x=x0+(tx-x0)*t;it.y=y0+(ty-y0)*t-Math.sin(t*Math.PI)*8});it.x=tx;it.y=ty;it.fly=false}
function slotPos(it){const arr=clothes.filter(o=>o.basket===it.basket),j=arr.indexOf(it);return [116+it.basket*28+1+j*5,76-SHAPE[it.t].length]}
async function toBasket(it,b){it.basket=b;const [x,y]=slotPos(it);await fly(it,x,y)}
function relayout(){clothes.forEach(c=>{if(c.basket>=0){const [x,y]=slotPos(c);c.x=x;c.y=y}})}

/* ---------- input ---------- */
function at(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const H2=hot();return Object.keys(H2).find(k=>{const h=H2[k];return x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h})||null}
cv.addEventListener('mousemove',e=>{hover=at(e);cv.style.cursor=hover&&!busy&&st[hover]!=='done'&&!(LOCK[hover]&&st[LOCK[hover]]!=='done')?'pointer':'default'});
cv.addEventListener('mouseleave',()=>hover=null);
cv.addEventListener('click',e=>{const k=at(e);if(k)start(k)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&exitSurvey){exitSurvey();return}if(e.key==='Escape'&&$('modal').classList.contains('on')&&!pending&&!surveyOpen)$('modal').classList.remove('on')});

function goUnit(u){if(u>=8){document.querySelector('.skip').open=false;

  return}location.hash=u===7?'credits':u>1?'unit-'+u:'start';location.reload()}
document.querySelectorAll('.skip .menu button').forEach(b=>b.onclick=()=>goUnit(+b.dataset.u));
document.addEventListener('click',e=>{const d=document.querySelector('.skip');if(d.open&&!d.contains(e.target))d.open=false});
(document.fonts?document.fonts.ready:Promise.resolve()).then(async()=>{frame();if(location.hash==='#results'){idle();askPassword();return}const u0=location.hash==='#credits';if(!u0&&(!survey||survey.post))await askSurvey('pre');const u=location.hash==='#credits'?'7':(location.hash.match(/^#unit-(\d)$/)||[])[1];if(u==='2')startLevel2();else if(u==='3')startLevel3();else if(u==='4')startLevel4();else if(u==='5')startLevel5();else if(u==='6')startLevel6();else if(u==='7')startCredits();else idle()});
